<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Live Meeting | منصة منارة العز التعليمية</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080d14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Almarai', Helvetica, Arial, sans-serif;
      color: #ffffff;
      position: relative;
    }
    #meetingSDKElement {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      overflow: hidden;
    }
    .top-floating-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2147483647 !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(11, 19, 30, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 9px 16px;
      font-size: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }
    .top-floating-bar a, .top-floating-bar button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      color: #fff;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .status-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      max-width: 520px;
      width: 90%;
      z-index: 20;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(15, 122, 108, 0.2);
      border-top-color: #0f7a6c;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      color: #ffffff;
      background-color: #0f7a6c;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(15, 122, 108, 0.25);
    }
    .btn:hover {
      background-color: #0c6156;
      transform: translateY(-1px);
    }
    .btn-blue {
      background-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-blue:hover {
      background-color: #1d4ed8;
    }
    .btn-slate {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-slate:hover {
      background-color: rgba(255, 255, 255, 0.18);
    }
    .card-info {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      gap: 16px;
      font-family: monospace;
      margin-top: 8px;
    }
    .fallback-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 20, 0.94);
      backdrop-filter: blur(8px);
      z-index: 2147483646;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .fallback-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon-badge {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .icon-badge-host {
      background: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, 0.35);
    }
    .icon-badge-student {
      background: rgba(15, 122, 108, 0.2);
      color: #34d399;
      border: 1px solid rgba(15, 122, 108, 0.35);
    }
  </style>

  <!-- React 18, ReactDOM 18 & Lodash (Required externals for Zoom Meeting SDK Embedded) -->
  <script src="/vendor/react.18.2.0.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js';"></script>
  <script src="/vendor/react-dom.18.2.0.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js';"></script>
  <script src="/vendor/lodash.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js';"></script>

  <!-- Zoom Meeting SDK Embedded (Local bundle with official CDN fallback) -->
  <script src="/zoom-meeting-embedded.min.js" onerror="this.onerror=null;this.src='https://source.zoom.us/zoom-meeting-embedded-6.5.0.min.js';"></script>
</head>
<body>

  <!-- Zoom Root Element (Pure container for Zoom Meeting SDK Component View) -->
  <div id="meetingSDKElement"></div>

  <!-- Loading Status Spinner & Card -->
  <div id="status-box" class="status-container">
    <div id="status-spinner" class="spinner"></div>
    <div id="status-title" style="font-weight: 800; font-size: 16px;">جاري إعداد الحصة المباشرة داخل لوحة التحكم...</div>
    <div id="status-desc" style="font-size: 12.5px; color: #94a3b8; line-height: 1.6;">
      يتم الاتصال بمشغل البث وتجهيز الصوت والفيديو.
    </div>
    <div id="info-pills" class="card-info" style="display: none;">
      <span id="pill-id"></span>
      <span id="pill-pass"></span>
    </div>
  </div>

  <!-- Fallback Overlay (displayed only if credentials missing or join rejected) -->
  <div id="fallback-overlay" class="fallback-overlay">
    <div class="fallback-card">
      <div id="fallback-icon-badge" class="icon-badge icon-badge-host">🎥</div>
      <div>
        <div id="fallback-title" style="font-weight: 800; font-size: 17px; margin-bottom: 6px;">
          بدء الحصة المباشرة
        </div>
        <div id="fallback-description" style="font-size: 13px; color: #94a3b8; line-height: 1.6;">
          يمكنك الدخول فوراً بضغطة زر واحدة.
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px;">
        <div id="fallback-error" style="display: none; font-size: 11.5px; color: #fca5a5; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 8px 12px; font-family: monospace; direction: ltr; text-align: left; word-break: break-word;"></div>
        <button id="fallback-retry-btn" type="button" class="btn btn-blue" style="width: 100%;">
          إعادة المحاولة داخل لوحة التحكم
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      console.log('[ZoomEmbed] Environment:', {
        hasReact: typeof window.React !== 'undefined',
        hasReactDOM: typeof window.ReactDOM !== 'undefined',
        hasLodash: typeof window._ !== 'undefined',
        hasZoomSDK: typeof window.ZoomMtgEmbedded !== 'undefined'
      });

      const DEFAULT_SDK_KEY = 'O3n0tKuQ0WS9yk0N9JeqQ';
      const DEFAULT_ZOOM_EMAIL = 'manartalezzacademy1@gmail.com';
      const urlParams = new URLSearchParams(window.location.search);
      const rawMeetingId = urlParams.get('meetingId') || '';
      const meetingId = rawMeetingId.replace(/\D/g, '') || rawMeetingId.replace(/\s/g, '');
      const passcode = urlParams.get('passcode') || '';
      const role = parseInt(urlParams.get('role') || '0', 10);
      const sdkSignature = urlParams.get('sdkSignature') || '';
      const sdkKeyFromParam = urlParams.get('sdkKey') || '';
      const userName = urlParams.get('userName') || (role === 1 ? 'المعلم' : 'الطالب');
      const userEmail = urlParams.get('userEmail') || DEFAULT_ZOOM_EMAIL;
      const startUrl = urlParams.get('startUrl') || '';
      const joinUrl = urlParams.get('joinUrl') || '';

      const isHost = (role === 1);

      // Host ZAK must come from the backend (GET /v2/users/{hostId}/token?type=zak).
      // The token embedded in start_url is rejected by the SDK ("Not support start meeting via tokens").
      const zakToken = urlParams.get('zak') || '';

      const launchAppUrl = isHost ? (startUrl || joinUrl || '') : (joinUrl || '');
      const webClientUrl = isHost
        ? (startUrl || joinUrl || '')
        : (meetingId ? ('https://us05web.zoom.us/wc/' + meetingId + '/join?prefer=1' + (passcode ? '&pwd=' + encodeURIComponent(passcode) : '')) : (joinUrl || ''));

      const floatBtnOpenApp = document.getElementById('float-btn-open-app');
      const floatBtnOpenWeb = document.getElementById('float-btn-open-web');
      const floatingMeetingId = document.getElementById('floating-meeting-id');
      const infoPills = document.getElementById('info-pills');
      const pillId = document.getElementById('pill-id');
      const pillPass = document.getElementById('pill-pass');
      const fallbackOverlay = document.getElementById('fallback-overlay');
      const fallbackIconBadge = document.getElementById('fallback-icon-badge');
      const fallbackTitle = document.getElementById('fallback-title');
      const fallbackDescription = document.getElementById('fallback-description');
      const fallbackError = document.getElementById('fallback-error');
      const fallbackRetryBtn = document.getElementById('fallback-retry-btn');
      const statusBox = document.getElementById('status-box');

      if (floatBtnOpenApp && launchAppUrl) {
        floatBtnOpenApp.href = launchAppUrl;
        floatBtnOpenApp.textContent = isHost ? 'بدء كمعلّم (Host)' : 'انضمام كطالب (Zoom)';
      }
      if (floatBtnOpenWeb && webClientUrl) {
        floatBtnOpenWeb.href = webClientUrl;
        floatBtnOpenWeb.textContent = isHost ? 'المتصفح (Host)' : 'المتصفح (طالب)';
      }

      if (meetingId || passcode) {
        if (infoPills) infoPills.style.display = 'flex';
        if (pillId && meetingId) pillId.textContent = 'Meeting ID: ' + meetingId;
        if (pillPass && passcode) pillPass.textContent = 'Passcode: ' + passcode;
        if (floatingMeetingId && meetingId) floatingMeetingId.textContent = 'ID: ' + meetingId;
      }

      function describeError(err) {
        if (!err) return '';
        if (typeof err === 'string') return err;
        const parts = [];
        if (err.errorCode !== undefined) parts.push('code ' + err.errorCode);
        if (err.type) parts.push(err.type);
        if (err.reason) parts.push(err.reason);
        if (err.message) parts.push(err.message);
        if (!parts.length) {
          try { return JSON.stringify(err); } catch (e) { return String(err); }
        }
        return parts.join(' — ');
      }

      function showFallback(customTitle, customDesc, err) {
        if (statusBox) statusBox.style.display = 'none';
        if (!fallbackOverlay) return;
        fallbackOverlay.style.display = 'flex';
        if (fallbackIconBadge) {
          fallbackIconBadge.className = isHost ? 'icon-badge icon-badge-host' : 'icon-badge icon-badge-student';
          fallbackIconBadge.textContent = isHost ? '👨‍🏫' : '🎓';
        }
        if (fallbackTitle) {
          fallbackTitle.textContent = customTitle || (isHost ? 'بدء الحصة المباشرة كمعلّم (Host)' : 'الانضمام إلى الحصة كطالب');
        }
        if (fallbackDescription) {
          fallbackDescription.textContent = customDesc || (isHost
            ? 'تعذّر بدء الحصة داخل لوحة التحكم. اضغط إعادة المحاولة.'
            : 'تعذّر الانضمام للحصة داخل لوحة التحكم. اضغط إعادة المحاولة.');
        }
        if (fallbackError && (err || !fallbackError.textContent)) {
          const msg = describeError(err);
          fallbackError.textContent = msg;
          fallbackError.style.display = msg ? 'block' : 'none';
        }
      }

      function hideFallback() {
        if (fallbackOverlay) fallbackOverlay.style.display = 'none';
        if (fallbackError) { fallbackError.textContent = ''; fallbackError.style.display = 'none'; }
      }

      if (fallbackRetryBtn) {
        fallbackRetryBtn.addEventListener('click', function() {
          hideFallback();
          if (statusBox) statusBox.style.display = 'flex';
          startZoomJoin();
        });
      }

      // Suppress native ".Fail to join the meeting" popup and display friendly Arabic fallback
      const observer = new MutationObserver(function() {
        const text = document.body ? (document.body.innerText || '') : '';
        if (fallbackOverlay && fallbackOverlay.style.display === 'flex') return;
        if (text.indexOf('Fail to join the meeting') !== -1 || text.indexOf('JOIN_MEETING_FAILED') !== -1) {
          showFallback(
            isHost ? 'بدء الحصة كمعلّم رئيسي (Host)' : 'الانضمام إلى الحصة المباشرة',
            isHost
              ? 'يرجى بدء الحصة كمعلّم ومضيف رئيسي (Host) عبر الرابط المباشر أدناه لتفعيل البث.'
              : 'يرجى الانضمام للحصة عبر الرابط المباشر أدناه للمشاركة مع المعلم.'
          );
          const modals = document.querySelectorAll('.zm-modal, .meeting-client-modal, [role="dialog"], .ant-modal, .ant-modal-root, .ant-modal-wrap, .modal-dialog');
          modals.forEach(function(modal) {
            if (modal.innerText && modal.innerText.indexOf('Fail to join') !== -1) {
              modal.style.display = 'none';
              modal.style.visibility = 'hidden';
            }
          });
          const masks = document.querySelectorAll('.ant-modal-mask, .zm-modal-backdrop');
          masks.forEach(function(mask) {
            mask.style.display = 'none';
          });
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      function decodeSignature(signature) {
        try {
          const parts = String(signature || '').split('.');
          if (parts.length < 2) return null;
          let base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4 !== 0) base64 += '=';
          return JSON.parse(atob(base64));
        } catch (e) {
          return null;
        }
      }

      function extractSdkKey(signature) {
        if (!signature || typeof signature !== 'string') return DEFAULT_SDK_KEY;
        try {
          const parts = signature.split('.');
          if (parts.length >= 2) {
            let base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4 !== 0) {
              base64 += '=';
            }
            const jsonStr = decodeURIComponent(atob(base64).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            const payload = JSON.parse(jsonStr);
            return payload.appKey || payload.sdkKey || payload.apiKey || payload.client_id || DEFAULT_SDK_KEY;
          }
        } catch(e) {}
        return DEFAULT_SDK_KEY;
      }

      let zoomClient = null;
      let isInitialized = false;

      function getZoomClient() {
        if (!zoomClient && window.ZoomMtgEmbedded) {
          zoomClient = window.ZoomMtgEmbedded.createClient();
        }
        return zoomClient;
      }

      function executeJoin() {
        if (!window.ZoomMtgEmbedded) {
          console.error('[ZoomEmbed] ZoomMtgEmbedded is not loaded on window');
          showFallback(
            'تعذّر تحميل مشغّل Zoom',
            'تحقق من الاتصال بالإنترنت ثم اضغط إعادة المحاولة.',
            'Zoom Meeting SDK script failed to load'
          );
          return;
        }

        if (!meetingId || !sdkSignature) {
          console.warn('[ZoomEmbed] Missing meetingId or sdkSignature:', { meetingId, hasSignature: Boolean(sdkSignature) });
          showFallback(
            'بيانات الجلسة غير مكتملة',
            'لم يُرسل الخادم بيانات التشغيل داخل لوحة التحكم لهذه الحصة.',
            'Missing ' + (!meetingId ? 'meetingId' : 'sdkSignature') + ' from /join API'
          );
          return;
        }

        try {
          const client = getZoomClient();
          if (!client) {
            console.error('[ZoomEmbed] Could not create Zoom client');
            showFallback(
              'تعذّر تشغيل Zoom',
              'اضغط إعادة المحاولة.',
              'ZoomMtgEmbedded.createClient() returned nothing'
            );
            return;
          }

          const meetingRoot = document.getElementById('meetingSDKElement');
          const leaveUrlParam = urlParams.get('leaveUrl');
          let leaveUrl = isHost
            ? (window.location.origin + '/teacher/sessions')
            : (window.location.origin + '/dashboard/student/schedule');
          if (leaveUrlParam) {
            leaveUrl = leaveUrlParam.startsWith('http')
              ? leaveUrlParam
              : (window.location.origin + (leaveUrlParam.startsWith('/') ? leaveUrlParam : '/' + leaveUrlParam));
          }

          const rootWidth = Math.max(meetingRoot.clientWidth || window.innerWidth || 1100, 800);
          const rootHeight = Math.max(meetingRoot.clientHeight || window.innerHeight || 650, 520);

          const initPromise = isInitialized
            ? Promise.resolve()
            : client.init({
                zoomAppRoot: meetingRoot,
                language: 'en-US',
                leaveUrl: leaveUrl,
                patchJsMedia: true,
                customize: {
                  video: {
                    isResizable: true,
                    viewSizes: {
                      default: {
                        width: rootWidth,
                        height: rootHeight
                      }
                    }
                  }
                }
              }).then(function() {
                isInitialized = true;
                console.log('[ZoomEmbed] Zoom SDK client initialized successfully');
              });

          initPromise.then(function() {
            const resolvedSdkKey = sdkKeyFromParam || extractSdkKey(sdkSignature) || DEFAULT_SDK_KEY;
            // Meeting SDK 4.x+ join params: the app key lives inside the signature (appKey claim).
            const joinConfig = {
              meetingNumber: String(meetingId).trim(),
              password: passcode || '',
              userName: (userName || (isHost ? 'المعلم' : 'الطالب')).trim(),
              signature: sdkSignature
            };
            const sigPayload = decodeSignature(sdkSignature);
            if (sigPayload) {
              console.log('[ZoomEmbed] Signature payload:', { role: sigPayload.role, mn: sigPayload.mn, appKey: sigPayload.appKey, exp: sigPayload.exp });
              if (isHost && Number(sigPayload.role) !== 1) {
                console.warn('[ZoomEmbed] Host is starting the meeting but the signature role is ' + sigPayload.role + '. The backend must sign with role=1.');
              }
              if (!sigPayload.appKey) {
                console.warn('[ZoomEmbed] Signature has no appKey claim; Meeting SDK 4.x+ requires it.');
              }
            }

            // Host starting a meeting MUST provide ZAK token
            if (zakToken) {
              joinConfig.zak = zakToken;
            }

            joinConfig.userEmail = (userEmail && String(userEmail).trim()) ? String(userEmail).trim() : DEFAULT_ZOOM_EMAIL;

            console.log('[ZoomEmbed] Initiating Zoom client.join()...', {
              meetingNumber: joinConfig.meetingNumber,
              isHost: isHost,
              hasZak: Boolean(zakToken),
              hasSignature: Boolean(sdkSignature),
              appKey: resolvedSdkKey,
              userName: joinConfig.userName,
              userEmail: joinConfig.userEmail
            });

            return client.join(joinConfig);
          }).then(function(res) {
            console.log('[ZoomEmbed] Zoom joined successfully!', res);
            if (statusBox) statusBox.style.display = 'none';
            hideFallback();
          }).catch(function(err) {
            console.warn('[ZoomEmbed] Zoom Meeting SDK join error:', err);
            if (isHost && err && Number(err.errorCode) === 200) {
              showFallback(
                'لا يمكن بدء الحصة كمضيف بدون ZAK',
                'يجب أن يُرجع الخادم في /join حقل zak الخاص بحساب المضيف (من Zoom API: users/{hostId}/token?type=zak).',
                err
              );
            } else {
              showFallback(null, null, err);
            }
          });
        } catch (err) {
          console.warn('[ZoomEmbed] Zoom Meeting SDK client init error:', err);
          showFallback(null, null, err);
        }
      }

      function startZoomJoin() {
        if (window.ZoomMtgEmbedded) {
          executeJoin();
        } else {
          let attempts = 0;
          const interval = setInterval(function() {
            attempts++;
            if (window.ZoomMtgEmbedded) {
              clearInterval(interval);
              console.log('[ZoomEmbed] ZoomMtgEmbedded ready after ' + (attempts * 100) + 'ms');
              executeJoin();
            } else if (attempts >= 50) {
              clearInterval(interval);
              console.warn('[ZoomEmbed] ZoomMtgEmbedded wait timeout after 5s');
              executeJoin();
            }
          }, 100);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startZoomJoin);
      } else {
        startZoomJoin();
      }
    })();
  </script>
</body>
</html>
