  <!-- Fallback Overlay (displayed if credentials missing, token invalid, or host start needed) -->
  <div id="fallback-overlay" class="fallback-overlay">
    <div class="fallback-card">
      <div id="fallback-icon-badge" class="icon-badge icon-badge-host">🎥</div>
      <div>
        <div id="fallback-title" style="font-weight: 800; font-size: 18px; margin-bottom: 6px; color: #ffffff !important;">
          الاتصال بالحصة المباشرة
        </div>
        <div id="fallback-description" style="font-size: 13.5px; color: #cbd5e1 !important; line-height: 1.6;">
          جاري إعداد البث المباشر والاتصال بالغرفة داخل لوحة التحكم...

      <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 6px;">

          🔄 إعادة المحاولة داخل المنصة

        <div id="fallback-polling-indicator" style="display: none; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: #34d399; margin-top: 4px;">
          <span class="spinner" style="width: 14px; height: 14px; border-width: 2px;"></span>

        </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      window.addEventListener('message', function(event) {
        if (!event.data || typeof event.data !== 'object') return;
        const type = event.data.type;
        if (type === 'ZOOM_TOGGLE_AUDIO') {
          try {
            const btn = document.querySelector('.audio-btn') || document.querySelector('.join-audio-container') || document.querySelector('[aria-label*="Audio"]') || document.querySelector('[aria-label*="audio"]');
            if (btn) btn.click();
          } catch (e) {
            console.warn('[ZoomEmbed] Toggle audio error:', e);
          }
        } else if (type === 'ZOOM_TOGGLE_VIDEO') {
          try {
            const btn = document.querySelector('.video-btn') || document.querySelector('[aria-label*="Video"]') || document.querySelector('[aria-label*="video"]');
            if (btn) btn.click();
          } catch (e) {
            console.warn('[ZoomEmbed] Toggle video error:', e);
          }
        }
      });

      // Handle meeting leave / ended breakout from iframe
      if (urlParams.get('ended') === '1') {
        const leaveTo = urlParams.get('leaveTo') || (window.location.origin + '/dashboard/teacher/sessions');
        console.log('[ZoomEmbed] Meeting left. Redirecting top window to:', leaveTo);
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'ZOOM_MEETING_LEFT', leaveUrl: leaveTo }, '*');
          }
        } catch (e) {}
        try {
          if (window.top && window.top !== window.self) {
            window.top.location.href = leaveTo;
            return;
          }
        } catch (e) {}
        window.location.href = leaveTo;
        return;
      }

      console.log('[ZoomEmbed v2] Environment detected:', {
        hasReact: typeof window.React !== 'undefined',
        hasReactDOM: typeof window.ReactDOM !== 'undefined',
        hasLodash: typeof window._ !== 'undefined',
        hasZoomMtg: typeof window.ZoomMtg !== 'undefined',
        hasZoomMtgEmbedded: typeof window.ZoomMtgEmbedded !== 'undefined'
      });

      const DEFAULT_SDK_KEY = 'O3n0tKuQ0WS9yk0N9JeqQ';
      const DEFAULT_ZOOM_EMAIL = 'manartalezzacademy1@gmail.com';
      const rawMeetingId = urlParams.get('meetingId') || '';
      const meetingId = rawMeetingId.replace(/\D/g, '') || rawMeetingId.replace(/\s/g, '');
      const rawPasscode = urlParams.get('passcode') || '';
      const role = parseInt(urlParams.get('role') || '0', 10);
      const sdkSignature = urlParams.get('sdkSignature') || '';
      const userName = urlParams.get('userName') || (role === 1 ? 'المعلم' : 'الطالب');
      const userEmail = urlParams.get('userEmail') || DEFAULT_ZOOM_EMAIL;
      const startUrl = urlParams.get('startUrl') || '';
      const joinUrl = urlParams.get('joinUrl') || '';
      const isHost = (role === 1);

      const extractPwdFromUrl = function(urlStr) {
        if (!urlStr) return '';
        try {
          const u = new URL(urlStr);
          return u.searchParams.get('pwd') || '';
        } catch(e) {
          const match = String(urlStr).match(/[?&]pwd=([^&#]+)/);
          return match ? decodeURIComponent(match[1]) : '';
        }
      };
      const passcode = (rawPasscode || extractPwdFromUrl(joinUrl) || extractPwdFromUrl(startUrl) || '').trim();

      const startUrlZak = (() => {
        try {
          return startUrl ? new URL(startUrl).searchParams.get('zak') : '';
        } catch(e) {
          return '';
        }
      })();
      const zakToken = urlParams.get('zak') || startUrlZak || '';

      const effectiveHostStartUrl = (() => {
        if (startUrl) {
          try {
            const u = new URL(startUrl);
            if (zakToken) u.searchParams.set('zak', zakToken);
            return u.toString();
          } catch (e) {
            return startUrl;
          }
        }
        if (meetingId && zakToken) {
          return 'https://us05web.zoom.us/s/' + meetingId + '?zak=' + encodeURIComponent(zakToken);
        }
        return joinUrl || '';
      })();

      const fallbackOverlay = document.getElementById('fallback-overlay');
      const fallbackIconBadge = document.getElementById('fallback-icon-badge');
      const fallbackTitle = document.getElementById('fallback-title');
      const fallbackDescription = document.getElementById('fallback-description');
      const fallbackError = document.getElementById('fallback-error');
      const fallbackRetryBtn = document.getElementById('fallback-retry-btn');
      const statusBox = document.getElementById('status-box');

      function describeError(err) {
        if (!err) return '';
        if (typeof err === 'string') return err;
        const parts = [];
        if (err.errorCode !== undefined) parts.push('code ' + err.errorCode);
        if (err.type) parts.push(err.type);
        if (err.reason) parts.push(err.reason);
        if (err.errorMessage) parts.push(err.errorMessage);
        if (err.message) parts.push(err.message);
        if (!parts.length) {
          try { return JSON.stringify(err); } catch (e) { return String(err); }
        }
        return parts.join(' — ');
      }

      function showFallback(customTitle, customDesc, err) {
        if (statusBox) statusBox.style.display = 'none';
        if (!fallbackOverlay) return;
        fallbackOverlay.style.display = 'flex';
        if (fallbackIconBadge) {
          fallbackIconBadge.className = isHost ? 'icon-badge icon-badge-host' : 'icon-badge icon-badge-student';
          fallbackIconBadge.textContent = isHost ? '👨‍🏫' : '🎓';
        }
        if (fallbackTitle) {
          fallbackTitle.textContent = customTitle || (isHost ? 'جاري الاتصال بالبث كمعلّم' : 'في انتظار بدء الحصة المباشرة');
        }
        if (fallbackDescription) {
          fallbackDescription.textContent = customDesc || (isHost
            ? 'جاري تجهيز البث وإعداد الحصة المباشرة داخل لوحة التحكم...'
            : 'في انتظار بدء المعلم للحصة المباشرة. جاري التحقق تلقائياً...');
        }
        if (fallbackError && err) {
          const msg = describeError(err);
          fallbackError.textContent = msg;
          fallbackError.style.display = msg ? 'block' : 'none';
        } else if (fallbackError) {
          fallbackError.textContent = '';
          fallbackError.style.display = 'none';
        }
      }

      function hideFallback() {
        if (fallbackOverlay) fallbackOverlay.style.display = 'none';
        if (fallbackError) { fallbackError.textContent = ''; fallbackError.style.display = 'none'; }
      }

      let autoPollTimer = null;
      let autoPollAttempts = 0;
      const MAX_AUTO_POLL_ATTEMPTS = 25;

      function stopAutoPoll() {
        if (autoPollTimer) {
          clearInterval(autoPollTimer);
          autoPollTimer = null;
        }
        autoPollAttempts = 0;
        const indicator = document.getElementById('fallback-polling-indicator');
        if (indicator) indicator.style.display = 'none';
      }

      function startAutoPoll(cfg) {
        // Teacher is host, do not auto-poll
        if (isHost) return;
        if (autoPollTimer || !cfg) return;
        autoPollAttempts = 0;
        const indicator = document.getElementById('fallback-polling-indicator');
        if (indicator) indicator.style.display = 'flex';
        autoPollTimer = setInterval(function() {
          autoPollAttempts++;
          if (autoPollAttempts > MAX_AUTO_POLL_ATTEMPTS) {
            stopAutoPoll();
            return;
          }
          if (zoomClient && isInitialized) {
            console.log('[ZoomEmbed v2] Auto-checking if teacher started meeting (attempt ' + autoPollAttempts + ')...');
            zoomClient.join(Object.assign({}, cfg)).then(function(res) {
              console.log('[ZoomEmbed v2] Meeting joined via student poll!', res);
              stopAutoPoll();
              if (statusBox) statusBox.style.display = 'none';
              hideFallback();
            }).catch(function(err) {
              console.debug('[ZoomEmbed v2] Auto-poll: not ready yet:', err && err.reason ? err.reason : err);
            });
          }
        }, 8000);
      }

      if (fallbackRetryBtn) {
        fallbackRetryBtn.addEventListener('click', function() {
          stopAutoPoll();
          hideFallback();
          if (statusBox) statusBox.style.display = 'flex';
          window.location.reload();
        });
      }

      let zoomClient = null;
      let isInitialized = false;

      function getZoomClient() {
        if (!zoomClient && window.ZoomMtgEmbedded) {
          zoomClient = window.ZoomMtgEmbedded.createClient();
        }
        return zoomClient;
      }

      function decodeJwtPayload(signature) {
        if (!signature || typeof signature !== 'string') return null;
        try {
          const parts = signature.split('.');
          if (parts.length >= 2) {
            let base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4 !== 0) base64 += '=';
            const jsonStr = decodeURIComponent(atob(base64).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonStr);
          }
        } catch(e) {}
        return null;
      }

      function extractSdkKey(signature) {
        const payload = decodeJwtPayload(signature);
        if (payload) {
          return payload.appKey || payload.sdkKey || payload.apiKey || payload.client_id || DEFAULT_SDK_KEY;
        }
        return DEFAULT_SDK_KEY;
      }

      function handleJoinFailure(err) {
        console.warn('[ZoomEmbed v2] Join failure details:', JSON.stringify(err), err);
        const isSignatureError = err && (err.errorCode === 3712 || (err.errorMessage && err.errorMessage.includes('Signature is invalid')));
        if (isHost) {
          showFallback(
            'جاري الاتصال بالبث المباشر كمعلّم',
            'يتم التحقق من بيانات البث وتجهيز الغرفة تلقائياً داخل المنصة...',
            null
          );
        } else {
          showFallback(
            'في انتظار بدء الحصة المباشرة',
            'المعلم يقوم بتجهيز البث حالياً، وسيتم الاتصال تلقائياً فور بدء الحصة داخل لوحة التحكم...',
            null
          );
        }
      }

      function joinViaZoomMtg(leaveUrl) {
        console.log('[ZoomEmbed v2] Initializing ZoomMtg Client View as instructed by Codex...');
        try {
          window.ZoomMtg.setZoomJSLib('https://source.zoom.us/3.11.0/lib', '/av');
          window.ZoomMtg.preLoadWasm();
          if (window.ZoomMtg.i18n) {
            window.ZoomMtg.i18n.load('en-US');
            window.ZoomMtg.i18n.reload('en-US');
          }
        } catch (setupErr) {
          console.warn('[ZoomEmbed v2] ZoomMtg setup warning:', setupErr);
        }
        const rootEl = document.getElementById('zmmtg-root');
        if (rootEl) rootEl.style.display = 'block';
        if (window.ZoomMtg.inMeetingServiceListener) {
          try {
            window.ZoomMtg.inMeetingServiceListener('onMeetingStatus', function(data) {
              console.log('[ZoomEmbed v2] Meeting status changed:', data);
              if (data && (data.meetingStatus === 1 || data.meetingStatus === 2)) {
                if (statusBox) statusBox.style.display = 'none';
              }
            });
          } catch (listenerErr) {
            console.warn('[ZoomEmbed v2] inMeetingServiceListener warning:', listenerErr);
          }
        }
        window.ZoomMtg.init({
          leaveUrl: leaveUrl,
          isSupportAV: true,
          patchJsMedia: true,
          screenShare: true,
          disablePreview: true,
          success: function() {
            console.log('[ZoomEmbed v2] ZoomMtg.init succeeded');
            const sigPayload = decodeJwtPayload(sdkSignature);
            let targetMeetingNumber = String(meetingId).trim();
            if (sigPayload && sigPayload.mn !== undefined) {
              targetMeetingNumber = sigPayload.mn;
            } else if (/^\d+$/.test(targetMeetingNumber)) {
              targetMeetingNumber = Number(targetMeetingNumber);
            }
            const resolvedSdkKey = (sigPayload && (sigPayload.sdkKey || sigPayload.appKey)) || urlParams.get('sdkKey') || extractSdkKey(sdkSignature);
            const joinConfig = {
              meetingNumber: targetMeetingNumber,
              passWord: String(passcode || '').trim(),
              sdkKey: resolvedSdkKey,
              signature: sdkSignature,
              userName: (userName || (isHost ? 'المعلم' : 'الطالب')).trim(),
              userEmail: (userEmail && String(userEmail).trim()) ? String(userEmail).trim() : DEFAULT_ZOOM_EMAIL,
              success: function(res) {
                console.log('[ZoomEmbed v2] Joined successfully via ZoomMtg', res);
                stopAutoPoll();
                hideFallback();
                if (statusBox) statusBox.style.display = 'none';
              },
              error: function(err) {
                console.error('[ZoomEmbed v2] ZoomMtg.join error:', JSON.stringify(err), err);
                if (window.ZoomMtgEmbedded) {
                  console.log('[ZoomEmbed v2] Falling back to ZoomMtgEmbedded Component View after ZoomMtg.join error');
                  joinViaZoomMtgEmbedded(leaveUrl);
                } else {
                  handleJoinFailure(err);
                }
              }
            };
            if (isHost && zakToken) {
              joinConfig.zak = zakToken;
            }
            console.log('[ZoomEmbed v2] Invoking ZoomMtg.join with:', {
              meetingNumber: joinConfig.meetingNumber,
              meetingNumberType: typeof joinConfig.meetingNumber,
              sdkKey: joinConfig.sdkKey,
              isHost: isHost,
              hasZak: Boolean(joinConfig.zak),
              hasSignature: Boolean(joinConfig.signature),
              userName: joinConfig.userName,
              userEmail: joinConfig.userEmail
            });
            window.ZoomMtg.join(Object.assign({}, joinConfig));
            setTimeout(function() {
              if (statusBox) statusBox.style.display = 'none';
            }, 1500);
          },
          error: function(err) {
            console.error('[ZoomEmbed v2] ZoomMtg.init failed:', JSON.stringify(err), err);
            if (window.ZoomMtgEmbedded) {
              console.log('[ZoomEmbed v2] Falling back to ZoomMtgEmbedded Component View');
              joinViaZoomMtgEmbedded(leaveUrl);
            } else {
              handleJoinFailure(err);
            }
          }
        });
      }

      function joinViaZoomMtgEmbedded(leaveUrl) {
        console.log('[ZoomEmbed v2] Initializing ZoomMtgEmbedded Component View...');
        const client = getZoomClient();
        if (!client) {
          console.error('[ZoomEmbed v2] Could not create Zoom client');
          showFallback(
            'تعذّر تشغيل مشغّل البث',
            'يرجى الضغط على زر إعادة المحاولة للاتصال بالبث داخل لوحة التحكم.',
            'ZoomMtgEmbedded.createClient() returned nothing'
          );
          return;
        }

        const meetingRoot = document.getElementById('meetingSDKElement');
        const rootWidth = Math.max(meetingRoot.clientWidth || window.innerWidth || 1100, 800);
        const rootHeight = Math.max(meetingRoot.clientHeight || window.innerHeight || 650, 520);

        const initPromise = isInitialized
          ? Promise.resolve()
          : client.init({
              zoomAppRoot: meetingRoot,
              language: 'en-US',
              leaveUrl: leaveUrl,
              patchJsMedia: true,
              disablePreview: true,
              customize: {
                video: {
                  isResizable: true,
                  viewSizes: {
                    default: {
                      width: rootWidth,
                      height: rootHeight
                    }
                  }
                }
              }
            }).then(function() {
              isInitialized = true;
              console.log('[ZoomEmbed v2] Zoom SDK client initialized successfully');
            });

        let currentJoinConfig = null;

        initPromise.then(function() {
          const sigPayload = decodeJwtPayload(sdkSignature);
          let targetMeetingNumber = String(meetingId).trim();
          if (sigPayload && sigPayload.mn !== undefined) {
            targetMeetingNumber = sigPayload.mn;
          } else if (/^\d+$/.test(targetMeetingNumber)) {
            targetMeetingNumber = Number(targetMeetingNumber);
          }

          const resolvedSdkKey = (sigPayload && (sigPayload.sdkKey || sigPayload.appKey)) || urlParams.get('sdkKey') || extractSdkKey(sdkSignature);

          currentJoinConfig = {
            meetingNumber: targetMeetingNumber,
            password: String(passcode || '').trim(),
            sdkKey: resolvedSdkKey,
            userName: (userName || (isHost ? 'المعلم' : 'الطالب')).trim(),
            signature: sdkSignature,
            userEmail: (userEmail && String(userEmail).trim()) ? String(userEmail).trim() : DEFAULT_ZOOM_EMAIL
          };
          if (isHost && zakToken) {
            currentJoinConfig.zak = zakToken;
          }

          console.log('[ZoomEmbed v2] Initiating Zoom client.join()...', {
            meetingNumber: currentJoinConfig.meetingNumber,
            isHost: isHost,
            hasZak: Boolean(zakToken),
            hasSignature: Boolean(sdkSignature),
            userName: currentJoinConfig.userName,
            userEmail: currentJoinConfig.userEmail
          });

          return client.join(Object.assign({}, currentJoinConfig));
        }).then(function(res) {
          console.log('[ZoomEmbed v2] Zoom joined successfully!', res);
          stopAutoPoll();
          if (statusBox) statusBox.style.display = 'none';
          hideFallback();
        }).catch(function(err) {
          console.warn('[ZoomEmbed v2] Zoom Meeting SDK join error:', JSON.stringify(err), err);
          handleJoinFailure(err);
          if (currentJoinConfig) {
            startAutoPoll(currentJoinConfig);
          }
        });
      }

      function executeJoin() {
        if (!meetingId || !sdkSignature) {
          console.warn('[ZoomEmbed v2] Missing meetingId or sdkSignature:', { meetingId, hasSignature: Boolean(sdkSignature) });
          showFallback(
            isHost ? 'تجهيز بيانات البث كمعلّم' : 'في انتظار بدء الحصة',
            isHost
              ? 'جاري تجهيز مفاتيح البث والاتصال بالحصة المباشرة داخل لوحة التحكم...'
              : 'جاري التحقق من بدء الحصة المباشرة للاتصال تلقائياً داخل المنصة...',
            null
          );
          return;
        }

        const leaveUrlParam = urlParams.get('leaveUrl');
        let targetLeaveUrl = isHost
          ? (window.location.origin + '/dashboard/teacher/sessions')
          : (window.location.origin + '/dashboard/student/schedule');
        if (leaveUrlParam) {
          targetLeaveUrl = leaveUrlParam.startsWith('http')
            ? leaveUrlParam
            : (window.location.origin + (leaveUrlParam.startsWith('/') ? leaveUrlParam : '/' + leaveUrlParam));
        }

        // When embedded in an iframe, Zoom's leaveUrl redirects the iframe itself,
        // which causes the full dashboard app to load inside the small meeting player.
        // Instead, we point leaveUrl to zoom-embed.html?ended=1 so it breaks out of the iframe
        // and safely redirects window.top to the targetLeaveUrl!
        const effectiveLeaveUrl = (window.self !== window.top)
          ? (window.location.origin + '/zoom-embed.html?ended=1&leaveTo=' + encodeURIComponent(targetLeaveUrl))
          : targetLeaveUrl;

        console.log('[ZoomEmbed v2] Available engines:', {
          hasZoomMtg: typeof window.ZoomMtg !== 'undefined',
          hasZoomMtgEmbedded: typeof window.ZoomMtgEmbedded !== 'undefined',
          isHost: isHost,
          meetingId: meetingId,
          effectiveLeaveUrl: effectiveLeaveUrl
        });

        if (window.ZoomMtg) {
          joinViaZoomMtg(effectiveLeaveUrl);
        } else if (window.ZoomMtgEmbedded) {
          joinViaZoomMtgEmbedded(effectiveLeaveUrl);
        } else {
          showFallback(
            'تعذّر تحميل مشغّل Zoom',
            'تحقق من الاتصال بالإنترنت ثم اضغط إعادة المحاولة.',
            'Zoom Meeting SDK scripts failed to load'
          );
        }
      }

      // Auto-join observer: if a preview join button appears, auto-click it immediately
      const previewObserver = new MutationObserver(function() {
        try {
          const joinBtn = document.querySelector('.preview-join-button') ||
            document.querySelector('button[aria-label="Join"]') ||
            document.querySelector('button[aria-label*="Join"]') ||
            document.querySelector('button.btn-primary');
          if (joinBtn && joinBtn.offsetParent !== null && !joinBtn.dataset.autoclicked) {
            joinBtn.dataset.autoclicked = 'true';
            console.log('[ZoomEmbed] Auto-clicking preview Join button');
            setTimeout(function() {
              joinBtn.click();
            }, 300);
          }
        } catch (e) {}
      });
      try {
        previewObserver.observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}

      function startZoomJoin() {
        if (window.ZoomMtg || window.ZoomMtgEmbedded) {
          executeJoin();
        } else {
          let attempts = 0;
          const interval = setInterval(function() {
            attempts++;
            if (window.ZoomMtg || window.ZoomMtgEmbedded) {
              clearInterval(interval);
              console.log('[ZoomEmbed v2] Zoom SDK ready after ' + (attempts * 100) + 'ms');
              executeJoin();
            } else if (attempts >= 50) {
              clearInterval(interval);
              console.warn('[ZoomEmbed v2] Zoom SDK wait timeout after 5s');
              executeJoin();
            }
          }, 100);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startZoomJoin);
      } else {
        startZoomJoin();
      }
    })();
  </script>
</body>
</html>
