    <script>
      (function initWebMCP() {
        if (typeof navigator === 'undefined' || !navigator.modelContext || typeof navigator.modelContext.registerTool !== 'function') return;
        var BASE_API = window.__MANARET_CONFIG__.API_BASE_URL.replace(/\/+$/, '') + '/api';
        var controller = new AbortController();
        var signal = controller.signal;

        navigator.modelContext.registerTool({
          name: 'list_courses',
          description: 'List all available courses on the platform including Quran, Arabic language, and Islamic Studies.',
          inputSchema: { type: 'object', properties: { category: { type: 'string', enum: ['quran', 'arabic', 'islamic_studies', 'all'] } } },
          execute: async function(args) {
            var cat = (args && args.category) || 'all';
            var res = await fetch(BASE_API + '/courses' + (cat !== 'all' ? '?category=' + cat : ''));
            return res.json();
          }
        }, { signal: signal });

        navigator.modelContext.registerTool({
          name: 'get_platform_info',
          description: 'Get general information about the Manarat Al-Ezz platform, its mission, and contact details.',
          inputSchema: { type: 'object', properties: {} },
          execute: async function() {
            return { name: 'منارة العز | Manarat Al-Ezz', website: 'https://mezzedu.com/', apiBase: BASE_API, authDocs: 'https://mezzedu.com/auth.md' };
          }
        }, { signal: signal });
      })();
    </script>
